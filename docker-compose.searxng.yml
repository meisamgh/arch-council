services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: arch-council-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SEARXNG_BASE_URL: http://localhost:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-arch-council-local-only-change-me}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
